[workspace]
resolver = "2"
members = [
    "crates/clippo-core",
    "crates/clippo-store",
    "crates/clippo-wayland",
    "crates/clippo-ipc",
    "crates/clippod",
    "crates/clippo-cli",
    "crates/clippo-applet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/nilfactor/clippo"
authors = ["clippo contributors"]
rust-version = "1.75"

# Versions shared by every crate that needs them. Crates opt in with
# `foo = { workspace = true }` (plus their own `features = [...]` where needed);
# nothing here is pulled into the build until a member actually depends on it.
[workspace.dependencies]
# errors, logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

# async runtime + D-Bus
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zbus = "5"

# config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# storage
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
blake3 = "1"
oo7 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nucleo-matcher = "0.3"

# wayland data-control
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
rustix = { version = "1", features = ["pipe", "fs"] }

# CLI
clap = { version = "4", features = ["derive"] }

# internal crates
clippo-core = { path = "crates/clippo-core", version = "0.1.0" }
clippo-store = { path = "crates/clippo-store", version = "0.1.0" }
clippo-wayland = { path = "crates/clippo-wayland", version = "0.1.0" }
clippo-ipc = { path = "crates/clippo-ipc", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true
