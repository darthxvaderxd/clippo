[workspace]
resolver = "2"
members = [
    "crates/clippo-core",
    "crates/clippo-store",
    "crates/clippo-wayland",
    "crates/clippo-ipc",
    "crates/clippod",
    "crates/clippo-cli",
    "crates/clippo-applet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/nilfactor/clippo"
authors = ["clippo contributors"]
rust-version = "1.75"

# Versions shared by every crate that needs them. Crates opt in with
# `foo = { workspace = true }` (plus their own `features = [...]` where needed);
# nothing here is pulled into the build until a member actually depends on it.
[workspace.dependencies]
# errors, logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

# async runtime + D-Bus
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
# `tokio` rather than the default `async-io`: `clippod` already runs a tokio
# runtime, and zbus on async-io inside one spawns a second executor on its own
# thread to drive the connection. `blocking-api` is kept for the frontends,
# which have no runtime of their own to reach for.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# The served interface is a trait object (`Arc<dyn ClippoBackend>`), so its
# async methods need boxing that native `async fn` in traits does not give.
async-trait = "0.1"

# config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# storage
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
blake3 = "1"
# `tokio` rather than the default `async-std`, so the one runtime the daemon
# already has is the one the keyring talks to. `native_crypto` keeps oo7 off a
# second OpenSSL — the vendored one belongs to SQLCipher.
oo7 = { version = "0.3", default-features = false, features = ["tokio", "native_crypto", "tracing"] }
# `std` so its error type is a `std::error::Error` and can be a `#[source]`;
# 0.4 rather than 0.3 so the tree carries one copy, shared with tempfile's.
getrandom = { version = "0.4", features = ["std"] }
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nucleo-matcher = "0.3"

# wayland data-control
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
rustix = { version = "1", features = ["pipe", "fs"] }

# CLI
clap = { version = "4", features = ["derive"] }

# test support
tempfile = "3"
# Only for `.next()` on a zbus signal stream in the D-Bus round-trip test; zbus
# re-exports `futures_core`, which has the trait but not the extension methods.
futures-util = "0.3"

# internal crates
clippo-core = { path = "crates/clippo-core", version = "0.1.0" }
clippo-store = { path = "crates/clippo-store", version = "0.1.0" }
clippo-wayland = { path = "crates/clippo-wayland", version = "0.1.0" }
clippo-ipc = { path = "crates/clippo-ipc", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true
