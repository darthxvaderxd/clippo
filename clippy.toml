# No `msrv` key on purpose, so clippy reads each crate's own `rust-version`
# from its `Cargo.toml`. There is no longer one number for the workspace:
# `clippo-applet` depends on libcosmic, which is edition 2024 and declares 1.93,
# while every other crate here really does still build on 1.75. A single value
# here would have to be one or the other, and either way it would be wrong for
# most of the workspace.

# Clipboard blobs and D-Bus payloads make some functions legitimately wide;
# these thresholds are a little looser than the defaults on purpose.
too-many-arguments-threshold = 8
type-complexity-threshold = 350

# Secrets must never be printed. `dbg!` and friends bypass `tracing` filtering,
# so they are rejected outright rather than left to review.
disallowed-macros = [
    { path = "std::dbg", reason = "use tracing::debug! — dbg! can leak clipboard contents" },
]
