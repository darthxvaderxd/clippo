name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pre-installed for the milestones that need them: wayland-client and
      # xkbcommon (M1, M5), SQLCipher's vendored OpenSSL build (M2), and
      # dbus-run-session (M3) so the D-Bus round-trip test has a bus to use
      # instead of skipping itself.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            libssl-dev \
            dbus

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Under a private session bus: without one, clippo-ipc's round-trip test
      # skips, and a skipped test that reports a pass is worse than no test.
      - name: cargo test
        run: dbus-run-session -- cargo test --workspace

  # The dependency judgement, made by a tool with a current advisory database
  # rather than by reading the manifests. See deny.toml for what is checked,
  # what is deliberately accepted, and why.
  #
  # A separate job, and a *blocking* one. Separate because it is a different
  # question from "does this code compile and pass its tests": an advisory
  # published overnight against a crate nobody touched would otherwise turn the
  # fmt/clippy/test job red and make it useless as a signal about the change in
  # front of it. Blocking because the alternative — `continue-on-error` — is a
  # check nobody looks at, and because there is somewhere to put an advisory
  # that has been read and accepted: an `ignore` entry in deny.toml with the
  # reasoning next to it. Going red is the prompt to make that decision.
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needs neither the toolchain nor a build: the check reads Cargo.lock.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Separate job because it needs neither Rust nor the build: `res/` is data,
  # and nothing in `cargo test` looks at it. Without this, a typo in the
  # `.desktop` file is only found by installing on the target host and
  # wondering why clippo is missing from the panel applet list.
  resources:
    name: desktop + appstream + icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            appstream \
            libxml2-utils

      - name: Validate the applet .desktop entry
        run: desktop-file-validate res/com.nilfactor.Clippo.desktop

      - name: Validate the AppStream metainfo
        run: appstreamcli validate res/com.nilfactor.Clippo.metainfo.xml

      # `X-CosmicApplet=true` is what puts clippo in COSMIC's panel-applet
      # list. desktop-file-validate has no opinion about it — an X- key is
      # valid whatever it says — so losing it would pass every check above and
      # only show up as clippo silently not being offered on the panel.
      - name: X-CosmicApplet is still set
        run: grep -qx 'X-CosmicApplet=true' res/com.nilfactor.Clippo.desktop

      - name: Icons are well-formed SVG
        run: xmllint --noout res/icons/hicolor/*/apps/*.svg

      # The unit is not run here — there is no COSMIC session and no systemd
      # user manager on a runner — but the two directives clippo depends on
      # can at least be asserted to still be in it.
      - name: The unit still says what it has to say
        run: |
          grep -qx 'WantedBy=cosmic-session.target' res/clippod.service
          grep -qx 'Restart=on-failure' res/clippod.service
