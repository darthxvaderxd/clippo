name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pre-installed for the milestones that need them: wayland-client and
      # xkbcommon (M1, M5), SQLCipher's vendored OpenSSL build (M2), and
      # dbus-run-session (M3) so the D-Bus round-trip test has a bus to use
      # instead of skipping itself.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            libssl-dev \
            dbus

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Under a private session bus: without one, clippo-ipc's round-trip test
      # skips, and a skipped test that reports a pass is worse than no test.
      - name: cargo test
        run: dbus-run-session -- cargo test --workspace
