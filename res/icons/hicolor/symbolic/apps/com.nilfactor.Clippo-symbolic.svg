<?xml version="1.0" encoding="UTF-8"?>
<!--
  clippo panel icon, symbolic.

  Drawn on the 16x16 grid symbolic icons are designed for, so the strokes land
  on whole pixels at panel size. Monochrome by convention: COSMIC re-tints the
  whole thing to the panel's foreground colour, so the fill below is only what
  it looks like outside a theme.

  A clipboard with three entries on it — the shortest last, because a list that
  ends flush reads as a block of text rather than as a history.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#2e3436">
  <!-- Board, as a frame: outer rounded rect minus inner, with evenodd. -->
  <path fill-rule="evenodd" d="M 4 2 H 12 A 1.5 1.5 0 0 1 13.5 3.5 V 13.5 A 1.5 1.5 0 0 1 12 15 H 4 A 1.5 1.5 0 0 1 2.5 13.5 V 3.5 A 1.5 1.5 0 0 1 4 2 Z M 4.75 3.5 H 11.25 A 0.75 0.75 0 0 1 12 4.25 V 12.75 A 0.75 0.75 0 0 1 11.25 13.5 H 4.75 A 0.75 0.75 0 0 1 4 12.75 V 4.25 A 0.75 0.75 0 0 1 4.75 3.5 Z"/>
  <!-- Clamp, sitting over the top edge of the board. -->
  <path d="M 6.25 0.9 H 9.75 A 1 1 0 0 1 10.75 1.9 V 3.1 A 1 1 0 0 1 9.75 4.1 H 6.25 A 1 1 0 0 1 5.25 3.1 V 1.9 A 1 1 0 0 1 6.25 0.9 Z"/>
  <!-- Three entries. -->
  <rect x="5.5" y="6.2" width="5" height="1.2" rx="0.6"/>
  <rect x="5.5" y="8.7" width="5" height="1.2" rx="0.6"/>
  <rect x="5.5" y="11.2" width="3" height="1.2" rx="0.6"/>
</svg>
