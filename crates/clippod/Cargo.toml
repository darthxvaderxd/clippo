[package]
name = "clippod"
description = "The clippo daemon: owns the clipboard history and the D-Bus service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "clippod"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clippo-core = { workspace = true }
clippo-ipc = { workspace = true }
clippo-store = { workspace = true }
clippo-wayland = { workspace = true }
nucleo-matcher = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# Only to encode a real PNG for the copy-back tests: the one flavor that must
# never be offered back is the thumbnail the store derives, and it only derives
# one from bytes it can actually decode.
image = { workspace = true }
tempfile = { workspace = true }
