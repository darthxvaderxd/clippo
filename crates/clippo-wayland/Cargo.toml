[package]
name = "clippo-wayland"
description = "Wayland data-control client: watch selections and serve offers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "clippo_wayland"
path = "src/lib.rs"

# Debug binary from M1: prints every selection and its flavors.
[[bin]]
name = "clippo-watch"
path = "src/bin/clippo-watch.rs"
required-features = ["watch-bin"]

[features]
default = ["watch-bin"]
# The `clippo-watch` debug binary, and the argument-parsing and log-formatting
# crates only it needs. On by default so `cargo run --bin clippo-watch` just
# works; `clippod` can take this crate with `default-features = false` at M3
# rather than inheriting a second CLI parser and log formatter.
watch-bin = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
clippo-core = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
wayland-protocols-misc = { workspace = true }
xkbcommon = { workspace = true }
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
