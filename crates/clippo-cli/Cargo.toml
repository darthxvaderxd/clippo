[package]
name = "clippo-cli"
description = "The `clippo` command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# The crate is `clippo-cli`; the binary users type is `clippo`.
[[bin]]
name = "clippo"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clippo-core = { workspace = true }
clippo-ipc = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The blocking half of zbus, deliberately: the CLI makes one or two calls and
# exits, so an async runtime here would be a dependency and a nested-executor
# footgun in exchange for nothing. `clippo-ipc` generates both proxies from the
# same declarations, so this is the same interface the daemon serves.
zbus = { workspace = true }
