# clippo's secret-detection fixture corpus.
#
# DESIGN.md, `clippo-core`:
#
# > The entropy threshold must be tuned against a fixture corpus of real-world
# > strings (git SHAs, base64 blobs, UUIDs, minified JS, prose). False positives
# > here are annoying; false negatives are the actual risk.
#
# This is that corpus, and `corpus.rs` is the test that asserts the expected
# classification of every entry in it. Three sections, in the order the risk
# runs:
#
#   [[secret]]                  must be detected, by the named rule
#   [[safe]]                    must not be detected at all
#   [[accepted_false_positive]] is detected, is not a secret, and we know
#
# **Nothing here is a real credential.** Every value is synthetic: the tokens
# are the right shape with `ClippoFixture`/`EXAMPLE`/zero padding where the
# random part would be, the passwords were made up for this file, and the AWS
# id is the one from Amazon's own documentation. They are checked into a public
# repository, so they had better be worthless — and a fixture that was ever
# real would be one nobody could rotate.
#
# # Adding a fixture
#
# A new shape rule needs a `[[secret]]` here naming it; the test fails if any
# variant of `secrets::Shape` has no fixture, so the two lists cannot drift.
# When a user reports a false positive, the answer is a `[[safe]]` entry and
# whatever tuning makes it pass — in that order, so the report is pinned before
# it is fixed.

# ---------------------------------------------------------------------------
# Rule 1 — the password-manager MIME marker.
#
# `hint = true` is the selection carrying `x-kde-passwordManagerHint`. Both of
# these are values no heuristic would catch on its own, which is the point of
# the rule: the application told us.
# ---------------------------------------------------------------------------

[[secret]]
name = "keepassxc-password"
rule = "mime-hint"
hint = true
value = "Tr0ub4dor&3"
why = """
Eleven characters, so the entropy rule cannot reach it — nothing under twelve
can clear 3.5 bits/char. This is the copy from ROADMAP verification 4, and the
marker is the only thing that catches it."""

[[secret]]
name = "weak-password-from-a-manager"
rule = "mime-hint"
hint = true
value = "hunter2"
why = """
A terrible password is still a password. It is stored and pasteable like any
other entry — DESIGN.md is explicit that the marker masks rather than skips."""

# ---------------------------------------------------------------------------
# Rule 2 — provider-token shapes. One per pattern, at minimum.
# ---------------------------------------------------------------------------

