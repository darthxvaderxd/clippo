# ---------------------------------------------------------------------------
# Rule 3 — the entropy heuristic. The tunable one.
#
# These are the fixtures the threshold is tuned against; the figures are in the
# doc comment on `ENTROPY_THRESHOLD_BITS_PER_CHAR`. With `entropy_rule = false`
# in the config, every fixture in this group stops being detected and every
# fixture above keeps working — the corpus test asserts exactly that.
# ---------------------------------------------------------------------------

[[secret]]
name = "generated-password-20"
rule = "entropy"
value = "Xr4$Tp9!Lm2#Wq7&Zc5%"
why = "4.32 bits/char, four character classes. What a password manager generates."

[[secret]]
name = "generated-password-16"
rule = "entropy"
value = "mK8vT2qXw9RzB4nP"
why = "4.00 bits/char, three classes. The alphanumeric-only default of most generators."

[[secret]]
name = "generated-password-12"
rule = "entropy"
value = "aB3!xY9zQ7#w"
why = """
3.59 bits/char — the nearest true positive to the threshold, and the shortest
value that can clear it at all, since twelve distinct characters cap out at
log₂(12) = 3.585."""

[[secret]]
name = "api-secret-32"
rule = "entropy"
value = "Zk4mQ8pR2vN6xL0tJ7wY3bF5hD9sG1cA"
why = """
The shapeless kind: a 32-character application secret from a provider clippo
has no pattern for. This is the case the entropy rule exists for, and the one
that would be a false negative without it."""

# ---------------------------------------------------------------------------
# True negatives. DESIGN.md's list first, then the ones the corpus added.
# ---------------------------------------------------------------------------

[[safe]]
name = "git-sha-full"
value = "e2f9b1c4a7d63805fe1a2b3c4d5e6f7089abcdef"
why = """
3.95 bits/char, comfortably over the threshold, and stopped by the class gate:
hex is lowercase and digits, two classes. ROADMAP verification 4 copies one of
these and expects nothing to happen."""

[[safe]]
name = "git-sha-short"
value = "3e98799"
why = "Seven characters — under the length floor before anything else is asked."

[[safe]]
name = "git-sha-256"
value = "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
why = "Longer hex, same two classes. SHA-256 object ids look like this."

[[safe]]
name = "uuid-v4-lowercase"
value = "3f2b9c7e-8a41-4d6b-95e0-1c7a2f8d4b63"
why = """
4.02 bits/char — the highest-scoring true negative in the corpus, and the
reason hyphens do not count as a character class. Counting them would make this
three classes and flag every UUID anybody copies, which is DESIGN.md's own
false-positive check."""

[[safe]]
name = "uuid-v4-uppercase"
value = "3F2B9C7E-8A41-4D6B-95E0-1C7A2F8D4B63"
why = "The same, uppercased. Still two classes."

[[safe]]
