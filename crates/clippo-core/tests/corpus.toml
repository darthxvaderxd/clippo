# ---------------------------------------------------------------------------
# Accepted false positives.
#
# Detected, not actually secret, and left that way deliberately. DESIGN.md's
# ordering is that false positives are annoying and false negatives are the
# risk, so the bar for narrowing a rule is that the narrowing does not cost a
# true positive. Neither of these clears that bar — both would need the entropy
# rule to understand what the value *means*, not what it looks like.
#
# They are here rather than unlisted so that the behaviour is pinned: if a
# future change stops flagging them, this file is where the deliberate part of
# it gets written down. A user hitting one sees a masked entry that still
# pastes correctly, and `clippo reveal` shows it in full.
# ---------------------------------------------------------------------------

[[accepted_false_positive]]
name = "base64-of-a-sentence"
rule = "entropy"
value = "VGhlIHF1aWNrIGJyb3duIGZveCBqdW1wcyBvdmVyIHRoZSBsYXp5IGRvZy4="
why = """
4.96 bits/char and 60 characters, so it is inside the range the long blob above
escapes. Base64 of a sentence and base64 of a 32-byte key are the same string
to every rule clippo has; flagging both is the safe direction."""

[[accepted_false_positive]]
name = "version-string-with-build-metadata"
rule = "entropy"
value = "clippo-0.1.0-alpha.3+build.42"
why = """
3.98 bits/char, and three classes because `.` and `+` count as symbols where
`-` does not. Adding them to the structure set would fix this and would also
stop counting the symbols in a password that happens to use them."""
