[package]
name = "clippo-ipc"
description = "Shared zbus proxy and interface definitions for the com.nilfactor.Clippo service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
clippo-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# The one place a refusal is decided is also the one place it has to be
# recorded: `peer` logs which caller was turned away, with its pid and exe.
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time"] }
